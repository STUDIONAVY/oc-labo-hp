    .rel-card-title { font-size: 13px; font-weight: 700; color: var(--navy); margin-top: 4px; line-height: 1.45; }

    .foot-cta p { font-size: 14px; color: var(--gray); margin-bottom: 28px; line-height: 1.9; }

    footer { background: var(--white); border-top: 1px solid var(--border); padding: 32px 0 22px; }
    .footer-inner { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; padding: 0 32px; }
    .footer-nav { display: flex; gap: 22px; }
    .footer-nav a { font-size: 12px; color: var(--gray); text-decoration: none; }
    .footer-nav a:hover { color: var(--navy); }
    .footer-copy { font-size: 11.5px; color: var(--gray2); text-align: center; padding-top: 18px; border-top: 1px solid var(--border); max-width: 1200px; margin: 0 auto; padding: 18px 32px 0; }

</head>

      before_img: "", date: "2026-06-18",
      body: `<h2>作業内容</h2>
<p>退去後の2LDKマンションを全室クリーニング。キッチン・浴室・トイレ・洗面台・窓・フローリング・換気扇をすべて対応しました。</p>
<h2>使用薬剤・道具</h2>
<p>各箇所に適した専用洗剤を使い分け。フローリングはポリッシャーで仕上げ、原状回復に近い状態まで清掃しています。</p>
<h2>仕上がりのポイント</h2>
<p>管理会社様より「次の入居者がすぐ決まりそうなほどきれい」とご評価いただきました。空室クリーニングはお早めのご依頼をおすすめしています。</p>`
    }
  ];

  /* ─── URL から id を取得 ─── */
  const params = new URLSearchParams(location.search);
  const targetId = params.get('id');

  // id がない場合は一覧へリダイレクト
  if (!targetId) { location.replace('../'); }

  async function loadDetail() {
    let allWorks;
    try {
      const res = await fetch('../../data/works.json');
      if (!res.ok) throw new Error();
      const data = await res.json();
      allWorks = data.length ? data : FALLBACK;
    } catch {
      allWorks = FALLBACK;
    }

    const work = allWorks.find(w => w.id === targetId);

    if (!work) {
      document.getElementById('main-content').innerHTML = `
        <div class="not-found">
          <h2>施工事例が見つかりませんでした</h2>
          <p>URLが正しいか確認してください。</p>
          <a href="../" style="color:var(--navy);font-weight:600;">← 施工事例一覧へ戻る</a>
        </div>`;
      return;
    }

    /* SEO: titleとdescription更新 */
    document.title = `${work.title} | OC.LABO 施工事例`;
    document.getElementById('page-title').textContent = `${work.title} | OC.LABO 施工事例`;
    document.getElementById('page-desc').setAttribute('content', work.desc);
    document.getElementById('bc-title').textContent = work.title;

    /* BEFORE/AFTER セクション */
    const baHtml = (work.before_img && work.img) ? `
      <div class="ba-section">
        <p class="ba-label">BEFORE / AFTER</p>
        <div class="ba-grid">
          <div class="ba-item">
            <img src="${work.before_img}" alt="BEFORE - ${work.title}" loading="lazy">
            <span class="ba-badge ba-badge-before">BEFORE</span>
          </div>
          <div class="ba-item">
            <img src="${work.img}" alt="AFTER - ${work.title}" loading="lazy">
            <span class="ba-badge ba-badge-after">AFTER</span>
          </div>
        </div>
      </div>` : '';

    /* 関連事例（同カテゴリ または 同エリア、最大3件） */
    const related = allWorks
      .filter(w => w.id !== work.id && (w.category === work.category || w.area === work.area))
      .slice(0, 3);

    const relatedHtml = related.length ? `
      <div class="related">
        <h2 class="related-title">関連する施工事例</h2>
        <div class="related-grid">
          ${related.map(r => `
            <a href="index.html?id=${r.id}" class="rel-card">
              <img src="${r.img}" alt="${r.title}" loading="lazy">
              <div class="rel-card-body">
                <p class="rel-card-loc">${r.area}</p>
                <p class="rel-card-title">${r.title}</p>
              </div>
            </a>`).join('')}
        </div>
      </div>` : '';

    document.getElementById('main-content').innerHTML = `
      <!-- 2カラムレイアウト -->
      <div class="detail-cols">

        <!-- 左カラム: 画像（sticky） -->
        <div class="detail-col-img">
          <div class="article-hero">
            <img src="${work.img}" alt="${work.title}" loading="eager">
          </div>
        </div>

        <!-- 右カラム: テキストコンテンツ -->
        <div class="detail-col-content">
          <div class="article-meta">
            <span class="article-area">${work.area}</span>
            <h1 class="article-title">${work.title}</h1>
            <div class="article-info">
              <span>📅 ${work.date ? new Date(work.date).toLocaleDateString('ja-JP', {year:'numeric',month:'long',day:'numeric'}) : ''}</span>
              <span>🏷 ${work.category}</span>
            </div>
            <div class="article-tags">
              ${(work.tags || []).map(t => `<span class="article-tag">${t}</span>`).join('')}
            </div>
          </div>

          <hr>

          <!-- BEFORE / AFTER -->
          ${baHtml}

          <!-- 本文 -->
          <div class="article-body">
            <p>${work.desc}</p>
            ${work.body || ''}
          </div>

          <div style="margin-top:40px;">
            <a href="../" style="color:var(--navy);font-size:13px;font-weight:600;text-decoration:none;">
              ← 施工事例一覧へ戻る
            </a>
          </div>
        </div>

      </div>

      <!-- 関連事例（フル幅） -->
      ${relatedHtml}
    `;
  }

  loadDetail();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>ページが見つかりませんでした | OC.LABO</title>
  <meta name="description" content="お探しのページは見つかりませんでした。金沢市のハウスクリーニング・エアコンクリーニングはOC.LABOへ。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#F9F8F5;--navy:#1a2744;--gray:#6b7280;--border:#e5e3dc}
    body{background:var(--bg);color:var(--navy);font-family:"Noto Sans JP",sans-serif;line-height:1.8;
      min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px}
    .wrap{max-width:560px;text-align:center}
    .code{font-family:"Noto Serif JP",serif;font-size:56px;font-weight:700;letter-spacing:.06em;color:#c9a84c;margin-bottom:8px}
    h1{font-family:"Noto Serif JP",serif;font-size:22px;font-weight:700;margin-bottom:18px}
    p{font-size:14px;color:var(--gray);margin-bottom:32px}
    .links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
    .btn{display:inline-flex;align-items:center;padding:13px 28px;border-radius:50px;font-size:14px;
      font-weight:600;text-decoration:none;border:1px solid var(--border);background:#fff;color:var(--navy);
      transition:transform .2s,box-shadow .2s}
    .btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(26,39,68,.1)}
    .btn.p{background:var(--navy);color:#fff;border-color:var(--navy)}
    @media(max-width:480px){.code{font-size:44px}h1{font-size:18px}.btn{width:100%;justify-content:center}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>お探しのページが見つかりませんでした</h1>
    <p>アドレスが変わったか、削除された可能性があります。<br>お手数ですが、下のリンクからお進みください。</p>
    <div class="links">
      <a class="btn p" href="/">トップページへ</a>
      <a class="btn" href="/works/">施工事例を見る</a>
    </div>
  </div>
</body>
</html>
